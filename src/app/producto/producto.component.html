<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalles del Producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngIf="producto">
    <img *ngIf="producto.image" [src]="producto.image" alt="{{ producto.title }}" class="producto-img" />
    <ion-card-header>
      <ion-card-title>{{ producto.title }}</ion-card-title>
      <ion-card-subtitle>{{ producto.category }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Descripción:</strong> {{ producto.description }}</p>
      <p><strong>Precio:</strong> ${{ producto.price }}</p>
      <p><strong>Stock:</strong> {{ producto.stock }}</p>
    </ion-card-content>
  </ion-card>

  <p *ngIf="!producto && !noEncontrado">Cargando...</p>
  <p *ngIf="noEncontrado">Producto no encontrado.</p>
</ion-content>
